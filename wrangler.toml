# ============================================================================
#  تنظیمات Cloudflare Workers — باشگاه مشتریان کافه
# ----------------------------------------------------------------------------
#  مراحل دیپلوی:
#   1) npm install
#   2) npx wrangler d1 create cafe-club-db
#      → مقدار database_id خروجی را در پایین جای‌گذاری کنید.
#   3) npx wrangler secret put JWT_SECRET
#   4) npm run db:init:remote
#   5) npm run deploy
# ============================================================================

name = "cafe-club"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# ----------------------------------------------------------------------------
# اتصال به دیتابیس D1
# ----------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "cafe-club-db"
database_id = "00000000-0000-0000-0000-000000000000"   # ← شناسه دیتابیس خود را قرار دهید

# ----------------------------------------------------------------------------
# جاب‌های خودکار (Cron Triggers) — زمان‌ها به UTC هستند (تهران = UTC+3:30)
#   - 19:30 UTC (۲۳:۰۰ تهران) : پیش‌بینی ریزش مشتریان (پیامک دلتنگی)
#   - 04:30 UTC (۰۸:۰۰ تهران) : تبریک تولد + کد تخفیف
#   - 05:00 UTC (۰۸:۳۰ تهران) : پیامک وضعیت آب‌وهوا
#   - هر ساعت                 : نگهداری (بازمحاسبه میانگین، پاک‌سازی، انقضا)
#   - ساعت ۲۰:۰۰ روز اول ماه  : گزارش ماهانه برای ادمین‌ها
# ⚠️ این عبارت‌ها باید دقیقاً با dispatchCron در src/lib/jobs.ts یکسان باشند.
# ----------------------------------------------------------------------------
[triggers]
crons = [
  "30 19 * * *",
  "30 4 * * *",
  "0 5 * * *",
  "0 * * * *",
  "0 20 1 * *"
]

# ----------------------------------------------------------------------------
# متغیرهای محیطی عمومی (غیرحساس)
# ----------------------------------------------------------------------------
[vars]
TZ_NAME = "Asia/Tehran"
# JWT_SECRET را هرگز اینجا ننویسید؛ از `wrangler secret put JWT_SECRET` استفاده کنید.

# ----------------------------------------------------------------------------
# تنظیمات اختیاری امنیتی و رصد
# ----------------------------------------------------------------------------
[observability]
enabled = true
head_sampling_rate = 1
